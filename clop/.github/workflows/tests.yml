name: tests
on:
  push: { branches: ["main", "v2"] }
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix: { python: ["3.10", "3.12", "3.13"] }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - run: pip install --index-url https://download.pytorch.org/whl/cpu torch && pip install -e ".[all]" pytest ruff
      - run: ruff check src tests scripts
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: pytest
      - run: clop demo -o demo && clop export -m demo/model.pt -o demo/site --web --onnx --atlas demo/synthetic.fa
