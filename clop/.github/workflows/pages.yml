name: web reader
on:
  push: { branches: ["main"], paths: ["src/clop/assets/web/**", "models/**", ".github/workflows/pages.yml"] }
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install --index-url https://download.pytorch.org/whl/cpu torch && pip install -e ".[umap]"
      - run: clop export -m models/clop-atlas6.pt -o _site --web --atlas models/atlas-sample.fa.gz --atlas-size 6000
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.deployment.outputs.page_url }}" }
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
